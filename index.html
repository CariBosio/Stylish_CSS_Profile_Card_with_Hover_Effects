<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stylish CSS Profile Card with Hover Effects</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="profile-card">
      <div class="image">
        <img src="woman.jpg" alt="user profile image" />
      </div>

      <div class="info-section">
        <div class="bio">
          <h2 class="name">Jessi Davis</h2>
          <p class="role">Web Developer</p>
          <p class="description">
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Facilis
            necessitatibus beatae id accusantium praesentium sapiente.
          </p>
        </div>

        <div class="action-area">
          <div class="social-icons">
            <a href=""><i class="fa-brands fa-instagram"></i></a>
            <a href=""><i class="fa-brands fa-twitter"></i></a>
            <a href=""><i class="fa-brands fa-github"></i></a>
          </div>
          <div class="projet">
            <a href="" class="projet-link">View Projects</a>
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
